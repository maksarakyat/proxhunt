name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile
        run: python -m compileall proxhunt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m proxhunt --version
          python -m proxhunt sources > /tmp/proxhunt-sources.txt
          test -s /tmp/proxhunt-sources.txt
